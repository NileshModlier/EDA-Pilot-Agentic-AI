[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-pilot"
version = "1.0.0"
description = "MCP tools, LangGraph loop, and ORFS benchmark harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
eda-pilot-orfs = "eda_pilot.server:main"

[tool.setuptools.packages.find]
include = ["eda_pilot*", "mcp_tools*", "agent*", "benchmarks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
